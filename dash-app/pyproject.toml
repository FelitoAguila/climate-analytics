[project]
name = "dash-app"
version = "0.1.0"
description = "Climate analytics web app for exploring historical daily temperatures, styled after the Materials Project website."
readme = "README.md"
authors = [
    { name = "Felix Manuel Aguila Alonso", email = "feloaguila@gmail.com" },
    { name = "Albert Alain Valdivia Garcia", email = "tcp.albertvaldivia1993@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dash>=2.17",
    "plotly>=5.20",
    "pandas>=2.2",
    "sqlalchemy>=2.1.8",
    "psycopg[binary]>=3.3.9",
    "cachetools>=8.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.3",
    "gunicorn>=27.0.1",
]

[project.scripts]
dash-app = "dash_app.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
